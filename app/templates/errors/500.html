{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h3 class="text-white fw-bold mb-3">Internal System Error</h3>
        <p class="text-muted mb-4">An unexpected ledger or database error occurred. Your transaction state has been rolled back safely.</p>
        <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('dashboard.landing') }}" class="btn btn-outline-light">
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card card-custom p-4 p-md-5 shadow-lg">
            <div class="text-center mb-4">
                <div class="badge bg-success p-3 rounded-4 mb-2">
                    <i class="bi bi-person-plus-fill fs-4 text-white"></i>
                </div>
                <h3 class="fw-bold text-white">Create Demo Account</h3>
                <p class="text-muted small">Sequential account provisioning with initial ₹0.00 balance</p>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label text-xs text-uppercase text-muted fw-bold">Full Legal Name</label>
                    <input type="text" name="full_name" class="form-control" placeholder="e.g. Priya Sharma" required>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-xs text-uppercase text-muted fw-bold">Username</label>
                        <input type="text" name="username" class="form-control font-monospace" placeholder="priya_demo" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-xs text-uppercase text-muted fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="priya@college.edu" required>
                    </div>
                </div>

                <div class="row g-2 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-xs text-uppercase text-muted fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-xs text-uppercase text-muted fw-bold">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Re-type password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-cyan w-100 py-2.5 mb-3">
                    Register Demo Account (Initial ₹0.00)
                </button>
            </form>

            <div class="pt-3 border-top border-custom text-center">
                <p class="text-muted small mb-1">Already registered?</p>
                <a href="{{ url_for('auth.login') }}" class="text-cyan small text-decoration-none">Sign in to existing account &rarr;</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

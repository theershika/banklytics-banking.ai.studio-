{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card card-custom p-4 p-md-5 shadow-sm">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="badge bg-success bg-opacity-25 text-success p-3 rounded-4">
                    <i class="bi bi-arrow-down-left fs-3"></i>
                </div>
                <div>
                    <h3 class="fw-bold text-white mb-0">Deposit Funds</h3>
                    <p class="text-muted small mb-0">Credit funds to Account #{{ account.account_number }}</p>
                </div>
            </div>

            <!-- Current Balance Bar -->
            <div class="p-3 card-inner d-flex justify-content-between align-items-center mb-4">
                <span class="text-muted small"><i class="bi bi-wallet2 text-cyan me-1"></i> Current Balance:</span>
                <span class="text-white font-monospace fw-bold fs-5">₹{{ "%.2f"|format(account.balance) }}</span>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label class="form-label text-xs text-uppercase text-muted fw-bold">Deposit Amount (₹ INR)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-cyan font-monospace fw-bold">₹</span>
                        <input type="number" step="0.01" min="0.01" name="amount" class="form-control form-control-lg font-monospace fw-bold text-white" placeholder="0.00" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-xs text-uppercase text-muted fw-bold">Description / Memo (Optional)</label>
                    <input type="text" name="description" class="form-control" placeholder="e.g. Consulting Honorarium, Grant Credit">
                </div>

                <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold">
                    <i class="bi bi-check-circle me-1"></i> Confirm Simulated Deposit
                </button>
            </form>

            <div class="mt-4 pt-3 border-top border-custom text-center text-muted small">
                <i class="bi bi-shield-check text-cyan me-1"></i>
                Updates MySQL database atomically using DECIMAL(15,2) arithmetic.
            </div>
        </div>
    </div>
</div>
{% endblock %}
